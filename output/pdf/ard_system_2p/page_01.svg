<svg xmlns="http://www.w3.org/2000/svg" width="841.89pt" height="595.28pt" viewBox="0 0 841.89 595.28"><rect width="100%" height="100%" fill="white"/><rect x="0" y="0" width="841.89" height="7" rx="0" fill="#087F83" stroke="#087F83" stroke-width=".8"/><text x="32" y="29.92" font-family="Malgun Gothic, sans-serif" font-size="9" font-weight="700" fill="#087F83">ARD / SYSTEM ENGINEERING</text><text x="32" y="62.239999999999995" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="700" fill="#173247">시스템 구성 및 제어 흐름</text><text x="32" y="85.36" font-family="Malgun Gothic, sans-serif" font-size="9.5" font-weight="400" fill="#567080">JC1060 통합 단말을 추가하고, 기존 구동·촬영·로봇 보드의 역할을 함께 정리했다.</text><text x="738" y="32.92" font-family="Malgun Gothic, sans-serif" font-size="9" font-weight="400" fill="#567080">2026.10.26</text><rect x="32" y="112" width="229" height="104" rx="6" fill="#FFFFFF" stroke="#087F83" stroke-width=".8"/><text x="45" y="133.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#087F83">JC1060P470C | 통합 단말</text><text x="45" y="155.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">화면·터치 조작 / 내장 마이크·스피커</text><text x="45" y="171.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">ESP32-P4 + ESP32-C6 / ES8311</text><text x="45" y="187.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">별도 전원 + 제작사 제공 배터리 모듈</text><rect x="324" y="112" width="213" height="104" rx="6" fill="#F0F5F8" stroke="#2365A5" stroke-width=".8"/><text x="337" y="133.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#2365A5">PC CENTER | ARD_MAIN</text><text x="337" y="155.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">명령 중계 / 상태·영상 통합</text><text x="337" y="171.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">선별 시퀀스 / 음성 인식·응답</text><text x="337" y="187.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">보드별 네트워크 연결 관리</text><polyline points="261,165 324,165" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="319.4977644882366,167.17482767055614 324,165 319.4977644882366,162.82517232944386" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="265.5022355117634,162.82517232944386 261,165 265.5022355117634,167.17482767055614" fill="none" stroke="#2365A5" stroke-width="1.6"/><text x="270" y="144.304" font-family="Malgun Gothic, sans-serif" font-size="8.3" font-weight="400" fill="#2365A5">조작·음성</text><text x="274" y="187.304" font-family="Malgun Gothic, sans-serif" font-size="8.3" font-weight="400" fill="#2365A5">상태·영상</text><rect x="600" y="112" width="209" height="104" rx="6" fill="#FFFFFF" stroke="#567080" stroke-width=".8" stroke-dasharray="4 3"/><text x="613" y="133.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#567080">기존 단말 | 선택 구성</text><text x="613" y="155.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">ControlMCU: 조이스틱·오디오</text><text x="613" y="171.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">HMI_MCU: CYD 화면·터치</text><text x="613" y="187.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">JC1060 전환 시 역할 대체 가능</text><polyline points="600,165 537,165" fill="none" stroke="#567080" stroke-width="1.2" stroke-dasharray="4 3"/><polyline points="541.5022355117634,162.82517232944386 537,165 541.5022355117634,167.17482767055614" fill="none" stroke="#567080" stroke-width="1.2"/><polyline points="595.4977644882366,167.17482767055614 600,165 595.4977644882366,162.82517232944386" fill="none" stroke="#567080" stroke-width="1.2"/><text x="549" y="144.216" font-family="Malgun Gothic, sans-serif" font-size="8.2" font-weight="400" fill="#567080">설정 선택</text><polyline points="430,216 430,246" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="146,246 694,246" fill="none" stroke="#2365A5" stroke-width="1.6"/><text x="32" y="236.92" font-family="Malgun Gothic, sans-serif" font-size="9" font-weight="700" fill="#2365A5">Wi-Fi / LAN</text><polyline points="146,246 146,280" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="143.82517232944386,275.4977644882366 146,280 148.17482767055614,275.4977644882366" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="148.17482767055614,250.5022355117634 146,246 143.82517232944386,250.5022355117634" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="430,246 430,280" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="427.82517232944383,275.4977644882366 430,280 432.17482767055617,275.4977644882366" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="432.17482767055617,250.5022355117634 430,246 427.82517232944383,250.5022355117634" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="694,246 694,280" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="691.8251723294438,275.4977644882366 694,280 696.1748276705562,275.4977644882366" fill="none" stroke="#2365A5" stroke-width="1.6"/><polyline points="696.1748276705562,250.5022355117634 694,246 691.8251723294438,250.5022355117634" fill="none" stroke="#2365A5" stroke-width="1.6"/><rect x="32" y="280" width="229" height="108" rx="6" fill="#FFFFFF" stroke="#087F83" stroke-width=".8"/><text x="45" y="301.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#087F83">DriveMCU | 독립 구동 보드</text><text x="45" y="323.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">ESP32-WROOM-32D / A4988 3축</text><text x="45" y="339.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">센서·OLED / GPS·부저 인터페이스</text><text x="45" y="355.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">PC 서버의 구동 명령 수신</text><rect x="316" y="280" width="229" height="108" rx="6" fill="#FFFFFF" stroke="#087F83" stroke-width=".8"/><text x="329" y="301.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#087F83">ImageSenderMCU | 영상</text><text x="329" y="323.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">ESP32-S3 / DVP 병렬 카메라</text><text x="329" y="339.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">촬영 이미지 → PC → 화면 표시</text><text x="329" y="355.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">Drive 측 5V 전원에서 공급</text><rect x="580" y="280" width="229" height="108" rx="6" fill="#FFFFFF" stroke="#567080" stroke-width=".8"/><text x="593" y="301.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#567080">Robot3AxisMCU | 로봇</text><text x="593" y="323.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">3축 STEP / DIR / EN</text><text x="593" y="339.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">4채널 릴레이 / 공압 그리퍼</text><text x="593" y="355.184" font-family="Malgun Gothic, sans-serif" font-size="9.3" font-weight="400" fill="#173247">L298N DC 모터 제어</text><rect x="32" y="412" width="505" height="112" rx="6" fill="#F0F5F8" stroke="#D5E0E7" stroke-width=".8"/><text x="46" y="433.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#087F83">JC1060이 추가되어도 구동은 DriveMCU가 담당</text><text x="46" y="457.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">터치·음성 입력 → PC 서버 → DriveMCU / Robot3AxisMCU</text><text x="46" y="473.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">카메라 영상 → PC 서버 → JC1060 화면</text><text x="46" y="489.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">JC1060 내장 화면·터치·오디오를 사용하며 외부 모터·센서는 연결하지 않는다.</text><text x="46" y="505.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">파란 선: 네트워크 데이터 흐름 / 회색 점선: 기존 단말의 선택 경로</text><rect x="554" y="412" width="255" height="112" rx="6" fill="#FFFFFF" stroke="#D5E0E7" stroke-width=".8"/><text x="568" y="433.56" font-family="Malgun Gothic, sans-serif" font-size="12" font-weight="700" fill="#BF5A17">전원 구성의 핵심 변경</text><text x="568" y="457.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">12V → 스텝다운 → 5V</text><text x="568" y="473.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">DriveMCU·센서·ImageSenderMCU 공급</text><text x="568" y="489.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">JC1060은 별도 전원·배터리 계통</text><text x="568" y="505.008" font-family="Malgun Gothic, sans-serif" font-size="9.1" font-weight="400" fill="#173247">전원 및 주요 GPIO 연결은 다음 쪽 참조</text><polyline points="32,556 810,556" fill="none" stroke="#D5E0E7" stroke-width="0.7"/><text x="32" y="572.04" font-family="Malgun Gothic, sans-serif" font-size="8" font-weight="400" fill="#567080">발표용 연결 요약 | 실물 전원 정보 + 소스 기반 신호 | 전기적 정격·실배선 검증 별도</text><text x="751" y="571.92" font-family="Malgun Gothic, sans-serif" font-size="9" font-weight="700" fill="#087F83">01 / 02</text></svg>