<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI기반 자동화 분류장치 · CG 구도 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eeed;color:#172f32;font-family:'Malgun Gothic',sans-serif}button,input{font:inherit}#frame{position:relative;width:100vw;height:calc(100vh - 80px);overflow:hidden;background:radial-gradient(ellipse at 58% 35%,#fff,#eef3f1 58%,#dfe7e5)}canvas{position:absolute;inset:0;width:100%;height:100%}.title{position:absolute;left:5.5%;top:7%;z-index:2;max-width:37%;pointer-events:none}.eyebrow{font-size:12px;letter-spacing:3px;color:#527976;margin-bottom:20px}.title h1{font-size:clamp(26px,3.2vw,60px);line-height:1.25;letter-spacing:-2px;margin:0 0 22px;font-weight:700}.title p{font-size:clamp(13px,1.25vw,23px);line-height:1.8;color:#597371;max-width:30em}.rule{width:52px;height:4px;background:#149b92;margin-bottom:26px}.caption{position:absolute;left:5.5%;bottom:8%;font-size:clamp(12px,1.15vw,20px);color:#55716f;max-width:37%;line-height:1.7;z-index:2}.tag{position:absolute;right:5%;top:7%;font-size:12px;letter-spacing:1px;color:#6d8583;z-index:2}.count{position:absolute;right:5%;bottom:8%;font-size:13px;color:#6d8583;z-index:2}#controls{height:80px;padding:15px 5.5%;display:flex;align-items:center;gap:18px;border-top:1px solid #d1ddda;background:#f5f8f6}button{border:1px solid #bbd2cd;background:#fff;border-radius:5px;padding:8px 16px;color:#214f4b;cursor:pointer}button:hover{background:#e2f3ee}#seek{flex:1;accent-color:#149b92;min-width:60px}#time{font-size:13px;white-space:nowrap}#status{position:absolute;inset:0;display:grid;place-items:center;background:#edf3f0;z-index:5;font-size:17px;color:#52736e}.hidden{display:none!important}#references{display:none}
</style>
<div id="frame">
 <div class="title"><div class="eyebrow">ARD · MECHANISM STUDY</div><div class="rule"></div><h1 id="title"></h1><p id="subtitle"></p></div>
 <div class="tag">CG 구도·구조 미리보기 / 음성 없음</div>
 <div class="caption" id="caption"></div><div class="count" id="count"></div>
 <div id="status">CAD를 불러오고 있습니다…</div>
</div>
<div id="controls"><button id="play">일시 정지</button><button id="restart">처음부터</button><input id="seek" type="range" min="0" max="36" step="0.033333" value="0" aria-label="영상 위치"><span id="time"></span></div>
<script src="/vendor/three.min.js"></script>
<script>
const frame=document.getElementById('frame'),duration=36;
const scene=new THREE.Scene();
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0xffffff,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
frame.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(31,1,1,6000);
scene.add(new THREE.HemisphereLight(0xffffff,0x68827b,1.25));
for(const [pos,power,color] of [[[200,750,600],1.8,0xfff9ee],[[-600,350,-250],.7,0xc3e6ed],[[450,50,-300],.8,0xffffff]]){
 const light=new THREE.DirectionalLight(color,power);light.position.set(...pos);scene.add(light);
}
const assembly=new THREE.Group(),core=new THREE.Group();scene.add(assembly,core);
const parts={};
const material=(color,opacity=1)=>new THREE.MeshStandardMaterial({color,roughness:.53,metalness:0,transparent:opacity<1,opacity,depthWrite:opacity===1,side:THREE.DoubleSide});
const grey=material(0x879993),pale=material(0xc5d2cc),teal=material(0x239f94),dark=material(0x44605b),glass=material(0x7eaaa1,.09);
async function stl(url,mat){
 const response=await fetch(url);if(!response.ok)throw Error('CAD 읽기 실패: '+url);
 const buffer=await response.arrayBuffer(),d=new DataView(buffer),n=d.getUint32(80,true);
 if(84+n*50!==buffer.byteLength)throw Error('STL 크기 오류: '+url);
 const pos=new Float32Array(n*9),nor=new Float32Array(n*9);
 for(let i=0;i<n;i++){
  const o=84+i*50;
  for(let v=0;v<3;v++)for(let a=0;a<3;a++){
   pos[i*9+v*3+a]=d.getFloat32(o+12+v*12+a*4,true);
   nor[i*9+v*3+a]=d.getFloat32(o+a*4,true);
  }
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.computeBoundingBox();
 return new THREE.Mesh(g,mat);
}
const src=name=>'/cad/'+encodeURIComponent(name);
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const center=new THREE.Vector3(-252,192,86);
const coreCenter=new THREE.Vector3(-218,103,87);
const titles=[
 ['AI기반 자동화<br>분류장치','비전의 판단을<br>기구의 움직임으로 연결합니다.','ARD_Model_v2 · 전체 조립 구조'],
 ['세 구조가 만드는<br>하나의 분류 동작','비전 카메라 · 상부 구동부 · 하부 레일','설명용 분해도 · 이동 거리와 분리 방향은 실제 분해 절차를 의미하지 않습니다.'],
 ['트레이 아래의<br>차동 베벨기어','두 입력과 출력부의<br>공간적 연결 관계를 확인합니다.','기어 회전과 감속비는 추가 확인 후 반영합니다.']
];
let seconds=0,playing=true,last=performance.now(),ready=false;
function setTime(t){
 seconds=Math.min(duration,Math.max(0,t));
 const shot=Math.min(2,Math.floor(seconds/12)),u=(seconds-shot*12)/12;
 const [title,sub,cap]=titles[shot];
 document.getElementById('title').innerHTML=title;
 document.getElementById('subtitle').innerHTML=sub;
 document.getElementById('caption').textContent=cap;
 document.getElementById('count').textContent=`0${shot+1} / 03`;
 document.getElementById('time').textContent=`${seconds.toFixed(1)} / 36초`;
 document.getElementById('seek').value=seconds;
 if(!ready)return;
 assembly.visible=shot<2;core.visible=shot===2;
 assembly.position.set(0,0,0);core.position.set(0,0,0);
 const spread=shot===1?ease(u*1.7)*65:0;
 parts.upper.position.y=spread;parts.plate.position.y=spread;parts.gear.position.y=spread;
 parts.cam.position.y=shot===1?spread*.5:0;
 parts.bins.visible=shot===0;
 if(shot===2){
   const ang=.75+ease(u)*.5;
   camera.position.set(coreCenter.x+Math.cos(ang)*380,coreCenter.y+170,coreCenter.z+Math.sin(ang)*380);
   camera.lookAt(coreCenter);
 }else{
   const ang=.85+(shot===0?ease(u)*.22:.22-ease(u)*.3);
   const target=center.clone();target.y=shot===1?210:190;
   camera.position.set(target.x-Math.cos(ang)*1370,target.y+650,target.z+Math.sin(ang)*1370);
   camera.lookAt(target);
 }
 // Put the CAD in the right-hand editorial area while leaving room for text.
 const w=frame.clientWidth,h=frame.clientHeight;
 camera.setViewOffset(w,h,-w*.165,0,w,h);camera.updateProjectionMatrix();
 renderer.render(scene,camera);
}
function resize(){renderer.setSize(frame.clientWidth,frame.clientHeight);camera.aspect=frame.clientWidth/frame.clientHeight;setTime(seconds);}
addEventListener('resize',resize);
document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'일시 정지':'재생';};
document.getElementById('restart').onclick=()=>setTime(0);
document.getElementById('seek').oninput=e=>{playing=false;document.getElementById('play').textContent='재생';setTime(+e.target.value);};
window.seekCG=t=>{playing=false;setTime(t);};window.cgReady=false;
async function init(){
 const specs=[
  ['base',src('하부이송구조.stl'),pale,assembly],
  ['upper','/assets/upper_without_core.stl',grey,assembly],
  ['plate','/assets/tray.stl',dark,assembly],
  ['gear',src('베벨기어 조립체.stl'),teal,assembly],
  ['cam',src('비전 캠 장치.stl'),dark,assembly],
  ['bins','/assets/bins.stl',glass,assembly],
  ['coreGear',src('베벨기어 조립체.stl'),teal,core],
  ['corePlate','/assets/tray.stl',dark,core]
 ];
 await Promise.all(specs.map(async([id,url,mat,parent])=>{const m=await stl(url,mat);parts[id]=m;parent.add(m);}));
 const shadowCanvas=document.createElement('canvas');shadowCanvas.width=128;shadowCanvas.height=128;
 const ctx=shadowCanvas.getContext('2d'),gradient=ctx.createRadialGradient(64,64,5,64,64,64);
 gradient.addColorStop(0,'rgba(38,73,62,.2)');gradient.addColorStop(1,'rgba(38,73,62,0)');
 ctx.fillStyle=gradient;ctx.fillRect(0,0,128,128);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(750,650),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false}));
 ground.rotation.x=-Math.PI/2;ground.position.set(-250,-29,85);assembly.add(ground);
 ready=true;window.cgReady=true;document.getElementById('status').classList.add('hidden');resize();
}
function tick(now){
 const dt=Math.min((now-last)/1000,.1);last=now;
 if(ready&&playing)setTime((seconds+dt)%duration);
 requestAnimationFrame(tick);
}
resize();requestAnimationFrame(tick);
init().catch(err=>{document.getElementById('status').textContent=err.message;console.error(err);});
</script>
</html>
