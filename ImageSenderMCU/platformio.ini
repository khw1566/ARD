[env]
lib_extra_dirs = ../shared

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>

build_flags = 
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 160000000L
board_upload.flash_size = 16MB

lib_deps =
    esp32-camera
    bblanchon/ArduinoJson @ ^6.21.3

; Same startup/memory settings as the application, without WiFi/camera code.
[env:psram-diagnostic]
extends = env:esp32-s3-n16r8
build_src_filter = +<power_diagnostic.cpp>
lib_deps =

; Compare flash mode while retaining Octal PSRAM and the same CPU frequency.
[env:psram-dio-diagnostic]
extends = env:psram-diagnostic
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio

; Isolate early brownouts without camera, WiFi or PSRAM initialization.
; Keep voltage protection enabled. Serial output uses the UART connector.
[env:power-diagnostic]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = +<power_diagnostic.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 80000000L
board_upload.flash_size = 16MB
