<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARD Terminal Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/theme-manager.js') }}?v=2"></script>
    <style>
        body {
            background-color: #0b1120;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'JetBrains Mono', Consolas, monospace;
        }

        .terminal-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #0f172a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .terminal-page-header h1 {
            font-size: 1.1rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #38bdf8;
            font-weight: 600;
        }

        .terminal-header-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .terminal-header-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s ease;
        }

        .terminal-header-links a:hover {
            color: #ffffff;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .terminal-main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px 20px;
            min-height: 0;
            gap: 10px;
        }

        .terminal-toolbar-full {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .terminal-screen-full {
            flex: 1;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .terminal-prompt-bar-full {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 14px;
        }
    </style>
</head>
<body>
    <header class="terminal-page-header">
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 17 10 11 4 5"></polyline>
                <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
            ARD Interactive Terminal Console
        </h1>
        <div class="terminal-header-links">
            <a href="/">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                메인 대시보드로 돌아가기
            </a>
        </div>
    </header>

    <main class="terminal-main-container">
        <!-- Quick Toolbar -->
        <div class="terminal-toolbar-full">
            <span style="font-size: 0.8rem; color: var(--secondary); margin-right: 4px;">빠른 실행:</span>
            <button class="term-quick-btn" data-cmd="help">help</button>
            <button class="term-quick-btn" data-cmd="version">version</button>
            <button class="term-quick-btn" data-cmd="hardware">hardware</button>
            <button class="term-quick-btn" data-cmd="stats">stats</button>
            <button class="term-quick-btn" data-cmd="status">status</button>
            <button class="term-quick-btn" data-cmd="server restart">server restart</button>
            <button class="term-quick-btn" data-cmd="clear">clear</button>
        </div>

        <!-- Terminal Output -->
        <div id="terminal-screen" class="terminal-screen-full">
            <div class="term-line term-welcome">ARD Interactive System Terminal [Version 2.4.0]</div>
            <div class="term-line term-welcome">'help'를 입력하면 사용 가능한 내부 명령어 목록을 확인할 수 있습니다.</div>
            <div class="term-line" style="margin-bottom: 8px;">---------------------------------------------------------------------</div>
        </div>

        <!-- Prompt Bar -->
        <div class="terminal-prompt-bar-full">
            <span class="terminal-prompt-prefix">ARD:~$</span>
            <input type="text" id="terminal-input" class="terminal-input" placeholder="명령어를 입력하세요... (예: help, version, server restart, ping 127.0.0.1)" autocomplete="off" spellcheck="false" autofocus>
            <button id="terminal-send-btn" class="btn-primary" style="width: auto; padding: 6px 18px; font-size: 0.82rem;">전송</button>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/theme-manager.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/terminal-controller.js') }}?v=2"></script>
</body>
</html>
